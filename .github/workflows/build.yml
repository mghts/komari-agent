name: Build and test Linux packages
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: 0.0.0-dev
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Verify installer
        run: python3 scripts/test_installer.py
      - name: Run Go tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/komari-agent:${{ inputs.version }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false
      - name: Smoke test runtime
        env:
          IMAGE: local/komari-agent:${{ inputs.version }}-${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/smoke.sh "$IMAGE" "$VERSION"
      - name: Export tested package
        env:
          IMAGE: local/komari-agent:${{ inputs.version }}-${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          container="$(docker create "$IMAGE")"
          docker cp "$container:/app/komari-agent" "dist/komari-agent-linux-$ARCH"
          docker save "$IMAGE" -o "dist/image-$ARCH.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: dist/
          retention-days: 7
